name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Build and upload to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Assert package version matches the tag
        run: |
          python -c "import afly,os,sys; v=afly.__version__; t=os.environ['GITHUB_REF_NAME'].lstrip('v'); sys.exit(0 if v==t else print(f'version {v} != tag {t}') or 1)"

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish via PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
