[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afly"
dynamic = ["version"]
description = "Idempotent AppsFlyer aggregate Pull API → ClickHouse extractor with a dbt-style CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "selishchev"}
]
keywords = ["appsflyer", "clickhouse", "etl", "marketing", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]

dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.25.0",
    "clickhouse-driver>=0.2.6",
    "clickhouse-connect>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock",
    "requests-mock",
    "ruff",
    "black",
    "mypy",
    "types-PyYAML",
    "types-requests",
    "build",
    "pre-commit",
    "detect-secrets",
]
integration = [
    "testcontainers[clickhouse]>=4.0",
]

[project.urls]
Homepage = "https://github.com/selishchev/afly"
Repository = "https://github.com/selishchev/afly"
Changelog = "https://github.com/selishchev/afly/blob/main/CHANGELOG.md"

[project.scripts]
afly = "afly.cli.main:cli"

[tool.setuptools.packages.find]
include = ["afly*"]

[tool.setuptools.package-data]
"afly.cli" = ["assets/**/*.md"]

[tool.setuptools.dynamic]
version = {attr = "afly.__version__"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests, no network/DB",
    "integration: needs Docker (ClickHouse testcontainer)",
]
